name: Generate GitHub Metrics (Full Calendar + Topic Icons)

on:
  schedule:
    - cron: "0 */6 * * *"   # প্রতি ৬ ঘন্টা পর পর অটো-আপডেট হবে
  workflow_dispatch:        # ম্যানুয়ালি "Run workflow" চাপলেও চলবে

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: RidoanDev
          template: classic
          filename: github-metrics.svg
          committer_branch: main
          committer_message: "chore(metrics): update GitHub metrics [skip ci]"

          # ---- Full contribution calendar (history) ----
          plugin_calendar: yes
          plugin_calendar_limit: 0        # 0 = পুরো একাউন্টের সম্পূর্ণ হিস্ট্রি
          plugin_calendar_weeks: 52

          # ---- Topics with icons (skills / interests) ----
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 20

          # ---- (Optional) extra useful plugins ----
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_analysis_timeout: 15
          plugin_stars: yes
          plugin_stars_limit: 4
